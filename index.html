<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Flight Tracker | SkyView Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0b0f19; color: #eaeef5; }
  header {
    padding: 16px 24px;
    background: #10141f;
    border-bottom: 1px solid #1f2635;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header h1 span { color: #4da3ff; }
  .stats { display: flex; gap: 20px; flex-wrap: wrap; }
  .stat-box {
    background: #161c2b; padding: 8px 16px; border-radius: 8px;
    text-align: center; min-width: 100px; border: 1px solid #232b3d;
  }
  .stat-box .num { font-size: 20px; font-weight: 700; color: #4da3ff; }
  .stat-box .label { font-size: 11px; color: #9aa4b8; margin-top: 2px; }
  #map { height: calc(100vh - 78px); width: 100%; }
  .leaflet-popup-content-wrapper { background: #161c2b; color: #eaeef5; }
  .leaflet-popup-tip { background: #161c2b; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; display: inline-block; margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  .loading-msg {
    position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
    background: #161c2b; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; color: #9aa4b8; z-index: 1000; border: 1px solid #232b3d;
  }
</style>
</head>
<body>

<header>
  <h1>✈️ Sky<span>View</span> Live — Real-Time Flight Tracker</h1>
  <div class="stats">
    <div class="stat-box">
      <div class="num" id="flightCount">--</div>
      <div class="label">FLIGHTS IN VIEW</div>
    </div>
    <div class="stat-box">
      <div class="num" id="avgAlt">--</div>
      <div class="label">AVG ALTITUDE (m)</div>
    </div>
    <div class="stat-box">
      <div class="num" id="avgSpeed">--</div>
      <div class="label">AVG SPEED (km/h)</div>
    </div>
    <div class="stat-box">
      <div class="num"><span class="status-dot"></span>LIVE</div>
      <div class="label" id="lastUpdate">updating...</div>
    </div>
  </div>
</header>

<div id="map"></div>
<div class="loading-msg" id="loadingMsg">Fetching live flight data...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // Free, no-auth flight tracking API (ADS-B Exchange v2 compatible format)
  // Centered near India, 250nm radius (max allowed)
  const CENTER_LAT = 22.97;
  const CENTER_LON = 78.65;
  const RADIUS_NM = 250;
  const API_URL = `https://api.adsb.one/v2/point/${CENTER_LAT}/${CENTER_LON}/${RADIUS_NM}`;

  const map = L.map('map', { zoomControl: true }).setView([CENTER_LAT, CENTER_LON], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  let markers = [];

  const planeIcon = (heading) => L.divIcon({
    className: '',
    html: `<div style="transform: rotate(${heading || 0}deg); font-size:20px; filter: drop-shadow(0 0 3px #4da3ff);">✈️</div>`,
    iconSize: [24, 24],
    iconAnchor: [12, 12]
  });

  async function fetchFlights() {
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error("API request failed: " + res.status);
      const data = await res.json();
      const aircraft = data.ac || [];

      markers.forEach(m => map.removeLayer(m));
      markers = [];

      let totalAlt = 0, totalSpeed = 0, validAlt = 0, validSpeed = 0;

      aircraft.forEach(a => {
        if (a.lat == null || a.lon == null) return;

        const altFt = typeof a.alt_baro === 'number' ? a.alt_baro : null;
        const altM = altFt != null ? Math.round(altFt * 0.3048) : null;
        const speedKmh = a.gs != null ? Math.round(a.gs * 1.852) : null;

        if (altM != null) { totalAlt += altM; validAlt++; }
        if (speedKmh != null) { totalSpeed += speedKmh; validSpeed++; }

        const marker = L.marker([a.lat, a.lon], { icon: planeIcon(a.track) })
          .addTo(map)
          .bindPopup(`
            <b>${a.flight ? a.flight.trim() : (a.hex || 'Unknown')}</b><br/>
            Type: ${a.t || 'N/A'}<br/>
            Altitude: ${altM != null ? altM + ' m' : 'N/A'}<br/>
            Speed: ${speedKmh != null ? speedKmh + ' km/h' : 'N/A'}
          `);
        markers.push(marker);
      });

      document.getElementById('flightCount').textContent = aircraft.length;
      document.getElementById('avgAlt').textContent = validAlt ? Math.round(totalAlt / validAlt) : '--';
      document.getElementById('avgSpeed').textContent = validSpeed ? Math.round(totalSpeed / validSpeed) : '--';
      document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString();
      document.getElementById('loadingMsg').style.display = 'none';

    } catch (err) {
      document.getElementById('loadingMsg').textContent = 'Could not fetch live data — retrying... (' + err.message + ')';
      document.getElementById('loadingMsg').style.display = 'block';
      console.error(err);
    }
  }

  fetchFlights();
  setInterval(fetchFlights, 15000);
</script>

</body>
</html>
